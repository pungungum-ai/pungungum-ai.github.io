<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문학 작품 분석노트 · 엄쌤이 알려주는 국어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF7; --ink:#1B1F23; --mid:#6E7378; --soft:#8D8A82; --faint:#B9B5AA;
  --rule:#E4E0D6; --hair:#F0EDE5;
  --pen:#C8443C; --pen-l:#FDF3F2; --mark:#2F6B4F;
  --serif:'Hahmlet',serif;
  --sans:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  --fs:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);
  font-size:var(--fs);line-height:1.75;word-break:keep-all;overflow-wrap:anywhere;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:660px;margin:0 auto;padding:0 20px 72px}

/* ── 머리띠 ── */
header{background:var(--paper);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:30}
.hd{max-width:660px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.hd .bk{border:0;background:none;font-size:19px;color:var(--mid);cursor:pointer;
  padding:2px 6px;margin-left:-8px;display:none;line-height:1}
.hd .bk:hover{color:var(--pen)}
.hd .tt{font-family:var(--serif);font-weight:600;font-size:.92em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .hm{flex-shrink:0;text-decoration:none;font-size:.78em;color:var(--mid);
  border-bottom:1px solid var(--rule);padding-bottom:1px}
.hd .hm:hover{color:var(--pen);border-bottom-color:currentColor}
.hd .fs{display:none;gap:6px}
.hd .fs button{border:1px solid var(--rule);background:none;color:var(--mid);font:inherit;
  font-size:.72em;padding:3px 8px;cursor:pointer;border-radius:0}
.hd .fs button:hover{border-color:var(--ink);color:var(--ink)}

/* ── 작품 목록 ── */
.srch{width:100%;font:inherit;font-size:1em;padding:9px 2px;border:0;
  border-bottom:1.5px solid var(--ink);background:none;color:var(--ink);
  border-radius:0;margin:26px 0 0}
.srch::placeholder{color:var(--faint)}
.srch:focus{outline:0;border-bottom-color:var(--pen)}
.wlist{margin-top:4px}
.witem{display:flex;align-items:baseline;gap:14px;padding:16px 2px;
  border-bottom:1px solid var(--hair);cursor:pointer}
.witem:hover b{color:var(--pen)}
.wcat{order:2;margin-left:auto;flex:none;font-size:.75em;color:var(--soft)}
.witem>div{order:1;min-width:0}
.witem b{font-family:var(--serif);font-size:1.1em;font-weight:600;display:block;
  letter-spacing:-.01em;line-height:1.5}
.witem span{font-size:.8em;color:var(--mid)}

/* ── 작품 머리 ── */
.whead{padding:30px 0 16px;border-bottom:2px solid var(--ink)}
.whead .cat{font-size:.78em;color:var(--mid)}
.whead h1{font-family:var(--serif);font-size:1.75em;font-weight:700;
  margin:6px 0 5px;letter-spacing:-.02em;line-height:1.3}
.whead .au{font-family:var(--serif);font-size:.95em;color:var(--mid)}
.whead .no{font-size:.76em;color:var(--faint);margin-top:9px}

/* ── 접이식 묶음 ── */
.sec{border-bottom:1px solid var(--rule)}
.sec>summary{list-style:none;cursor:pointer;padding:17px 0;display:flex;
  align-items:baseline;gap:12px;font-family:var(--serif);font-weight:600;font-size:1.02em}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:hover{color:var(--pen)}
.sec>summary .nu{flex:none;width:1.5em;font-size:.82em;color:var(--faint);
  font-variant-numeric:tabular-nums}
.sec>summary .ar{margin-left:auto;color:var(--faint);font-size:.72em;
  transition:transform .15s;font-family:var(--sans)}
.sec[open]>summary .ar{transform:rotate(180deg)}
.body{padding:0 0 26px 2px}

/* ── 이름표 + 내용 ── */
.kv{padding:12px 0;border-bottom:1px solid var(--hair)}
.kv:last-child{border-bottom:0}
.kv .k{font-size:.76em;color:var(--mid);margin-bottom:2px}
.kv .v{font-size:.96em}
.kv .v b{font-family:var(--serif);font-weight:600}
.note{border-left:2px solid var(--rule);padding:3px 0 3px 15px;margin-top:18px;
  font-size:.9em;color:var(--mid)}
.note b{color:var(--ink);font-family:var(--serif);font-weight:600}
ol.feat{margin:8px 0 0;padding-left:0;list-style:none;counter-reset:f}
ol.feat li{counter-increment:f;position:relative;padding-left:22px;margin:6px 0;font-size:.93em}
ol.feat li::before{content:counter(f);position:absolute;left:0;top:0;
  font-size:.8em;color:var(--faint);font-variant-numeric:tabular-nums}

/* ── 시상 전개 ── */
.step{padding:15px 0;border-bottom:1px solid var(--hair)}
.step:last-child{border-bottom:0}
.step .t{display:flex;align-items:baseline;gap:9px;margin-bottom:4px}
.step .t b{font-family:var(--serif);font-size:1em;font-weight:600}
.step .t em{font-style:normal;font-size:.76em;color:var(--mid)}
.step .b{font-size:.94em}
.step .m{font-size:.84em;color:var(--mid);margin-top:5px}

/* ── 원문 ── */
.blk{margin:22px 0 26px}
.blk .bh{display:block;font-size:.78em;color:var(--mid);margin-bottom:11px}
.poem{border-left:2px solid var(--rule);padding:2px 0 2px 17px}
.poem .ln{font-family:var(--serif);font-size:1.08em;line-height:1.95;margin-top:9px;
  letter-spacing:-.01em}
.poem .ln:first-child{margin-top:0}
.poem .nn{font-size:.78em;color:var(--mid);margin:3px 0 0 0;line-height:1.6}
.gl{margin-top:16px}
.gl .g{margin:10px 0;font-size:.92em;line-height:1.7}
.gl .g b{font-family:var(--serif);font-weight:600;margin-right:.35em}
.gl .g b::before{content:'‘'}
.gl .g b::after{content:'’'}
.gl .g.plain{color:var(--mid)}
.gl .g span{color:var(--mid)}
ol.num{margin:8px 0 0;padding-left:0;list-style:none;counter-reset:n}
ol.num li{counter-increment:n;position:relative;padding-left:22px;margin:9px 0;font-size:.92em}
ol.num li::before{content:counter(n);position:absolute;left:0;top:0;
  font-size:.8em;color:var(--faint);font-variant-numeric:tabular-nums}

/* ── 표현상 특징 ── */
.dev{padding:14px 0;border-bottom:1px solid var(--hair)}
.dev .n{display:flex;align-items:baseline;gap:9px;font-family:var(--serif);
  font-weight:600;font-size:1em}
.dev .n i{font-style:normal;font-family:var(--sans);font-weight:400;
  font-size:.74em;color:var(--faint);min-width:1.3em;font-variant-numeric:tabular-nums}
.dev .e{font-family:var(--serif);font-size:.95em;margin:6px 0 4px 1.9em;
  padding-left:13px;border-left:2px solid var(--rule)}
.dev .f{font-size:.87em;color:var(--mid);margin-left:1.9em}

/* ── 함정 ── */
.trap{border-left:3px solid var(--pen);background:var(--pen-l);
  padding:15px 17px;margin-top:22px}
.trap .th{font-family:var(--serif);font-weight:600;font-size:.94em;
  color:var(--pen);margin-bottom:9px}
.trap .ti{font-size:.89em;margin:8px 0;color:#7A3B36;line-height:1.7}
.trap .ti b{font-weight:600;color:#8E2F29;margin-right:.35em}
.trap .ti b::after{content:' :'}

/* ── 구조적 대응 ── */
.cont{margin-top:24px;padding-top:4px;border-top:1px solid var(--rule)}
.cont .ch{font-family:var(--serif);font-weight:600;font-size:.94em;margin:14px 0 6px}
.cont .ci{font-size:.89em;margin:9px 0}
.cont .ci b{display:block;font-family:var(--serif);font-weight:600;font-size:1.03em}
.cont .ci span{color:var(--mid)}

/* ── 시험 직전 정리 ── */
.fin{background:var(--ink);color:var(--paper);padding:20px 20px 22px;margin-top:4px}
.fin .fi{margin:14px 0;font-size:.92em}
.fin .fi:first-child{margin-top:0}
.fin .fi:last-child{margin-bottom:0}
.fin .fi b{display:block;font-size:.78em;color:#A8AFB3;margin-bottom:1px;font-weight:400}
.fin .fi span{font-family:var(--serif);line-height:1.8}

/* ── OX ── */
.oxq{padding:16px 0;border-bottom:1px solid var(--hair)}
.oxq .qq{display:flex;gap:10px;font-size:.95em;margin-bottom:12px}
.oxq .qq i{font-style:normal;flex:none;font-size:.78em;color:var(--faint);
  min-width:1.4em;font-variant-numeric:tabular-nums;padding-top:.2em}
.oxb{display:flex;gap:10px;margin-left:2.2em}
.oxb button{flex:1;max-width:110px;border:1.5px solid var(--rule);background:none;
  font-family:var(--serif);font-size:1.05em;font-weight:600;padding:8px;
  cursor:pointer;color:var(--mid);border-radius:0}
.oxb button:hover:enabled{border-color:var(--ink);color:var(--ink)}
.oxb button.ok{border-color:var(--mark);color:var(--mark)}
.oxb button.no{border-color:var(--pen);color:var(--pen)}
.oxs{margin:12px 0 0 2.2em;font-size:.88em;color:var(--mid);line-height:1.75}
.oxs b{color:var(--ink);font-family:var(--serif);font-weight:600}
.score{border:1.5px solid var(--ink);padding:20px;text-align:center;margin-top:22px}
.score b{font-family:var(--serif);font-size:1.7em;font-weight:700;display:block}
.score span{display:block;font-size:.84em;color:var(--mid);margin-top:4px}
.rst{border:1.5px solid var(--ink);background:none;font:inherit;font-size:.84em;
  color:var(--ink);padding:7px 17px;cursor:pointer;margin-top:14px;border-radius:0}
.rst:hover{background:var(--ink);color:var(--paper)}

.foot{text-align:center;color:var(--faint);font-size:.78em;margin-top:30px}
/* 화면이 넓으면 구절 풀이를 원문 오른쪽에 둔다 */
@media(min-width:900px){
  .wrap{max-width:880px}
  .hd{max-width:880px}
  .blk{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);
    column-gap:36px;align-items:start}
  .blk .bh{grid-column:1/-1}
  .poem{grid-column:1}
  .gl{grid-column:2;margin-top:0;padding-top:3px}
  .blk.noorig{display:block}
  .blk.noorig .gl{margin-top:9px}
  .gl .g{margin:0 0 13px}
}
@media(max-width:480px){ :root{--fs:15.5px} .wrap{padding:0 16px 72px} .hd{padding:11px 16px} }
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header><div class="hd">
  <button class="bk" id="bk" aria-label="뒤로">←</button>
  <div class="tt" id="tt">작품 분석 노트</div>
  <div class="fs" id="fs"><button id="fsm">가−</button><button id="fsp">가+</button></div>
  <a class="hm" href="index.html">← 처음으로</a>
</div></header>
<div id="app" class="wrap"></div>
<script src="lit-data.js"></script>
<script>

/* ── 첫 화면(index.html)에서 저장한 로그인 정보를 함께 쓴다 ── */
var IJS_KEY='ijs_user';
function ijsUser(){
  try{ var u=JSON.parse(localStorage.getItem(IJS_KEY)||'null'); return (u&&u.name)?u:null; }catch(e){ return null; }
}
function ijsAllow(kind){
  var u=ijsUser();
  if(!u || !u.allow) return null;
  var a=u.allow[kind];
  return (a && typeof a.length==='number') ? a : null;   /* null 이면 전부 공개 */
}
function ijsOpen(kind,title){
  var a=ijsAllow(kind);
  if(a===null) return true;
  var t=String(title).replace(/\s+/g,'');
  for(var i=0;i<a.length;i++){ if(String(a[i]).replace(/\s+/g,'')===t) return true; }
  return false;
}
const $=(s,r)=>(r||document).querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
let FS=16;
try{ FS=parseFloat(localStorage.getItem('fs'))||16; }catch(e){}
document.documentElement.style.setProperty('--fs',FS+'px');
function setFS(d){ FS=Math.min(21,Math.max(14,FS+d));
  document.documentElement.style.setProperty('--fs',FS+'px');
  try{ localStorage.setItem('fs',FS); }catch(e){} }
$('#fsm').onclick=()=>setFS(-1); $('#fsp').onclick=()=>setFS(1);

function kv(k,v){ const d=el('div','kv'); d.appendChild(el('div','k',k));
  d.appendChild(el('div','v',v)); return d; }
function sec(n,title,build,open){
  const d=document.createElement('details'); d.className='sec'; if(open) d.open=true;
  const s=document.createElement('summary');
  s.appendChild(el('span','nu',String(n)));
  s.appendChild(el('span',null,title));
  s.appendChild(el('span','ar','▾'));
  d.appendChild(s);
  const b=el('div','body'); build(b); d.appendChild(b);
  return d;
}

/* ── 목록 ── */
function home(){
  location.hash=''; $('#bk').style.display='none'; $('#fs').style.display='none';
  $('#tt').textContent='작품 분석 노트';
  const a=$('#app'); a.innerHTML='';
  const q=el('input','srch'); q.type='search'; q.placeholder='작품명이나 작가로 찾기';
  a.appendChild(q);
  const list=el('div','wlist'); a.appendChild(list);
  function draw(f){
    list.innerHTML='';
    const ws=LIT.works.filter(w=>!f ||
      (w.title+w.author+w.cat).toLowerCase().includes(f.toLowerCase()));
    if(!ws.length){ list.appendChild(el('div','foot','찾는 작품이 없습니다.')); return; }
    ws.forEach(w=>{
      const it=el('div','witem');
      it.appendChild(el('span','wcat',w.cat));
      const b=el('div'); b.appendChild(el('b',null,w.title));
      b.appendChild(el('span',null,w.author));
      it.appendChild(b);
      it.onclick=()=>open(w.id);
      list.appendChild(it);
    });
  }
  q.addEventListener('input',()=>draw(q.value.trim()));
  draw('');
  a.appendChild(el('div','foot','작품을 고르면 분석 노트가 열립니다.'));
  window.scrollTo(0,0);
}

/* ── 작품 ── */
function open(id){
  const w=LIT.works.find(x=>x.id===id); if(!w) return home();
  location.hash=id;
  $('#bk').style.display='block'; $('#fs').style.display='flex';
  $('#tt').textContent=w.title+' · '+w.author;
  const a=$('#app'); a.innerHTML='';

  const h=el('div','whead');
  h.appendChild(el('div','cat',w.cat));
  h.appendChild(el('h1',null,w.title));
  h.appendChild(el('div','au',w.author));
  if(w.note) h.appendChild(el('div','no','출전 '+w.note));
  a.appendChild(h);

  // 1 작품 개관
  a.appendChild(sec(1,'작품 개관',b=>{
    w.overview.forEach(([k,v])=>b.appendChild(kv(k,v)));
    const r=el('div','kv'); r.appendChild(el('div','k','운율'));
    w.rhythm.forEach(([k,v])=>{ const p=el('div','v'); p.innerHTML='<b>'+k+'</b> '+v;
      p.style.marginTop='4px'; r.appendChild(p); });
    b.appendChild(r);
    const f=el('div','kv'); f.appendChild(el('div','k','특징'));
    const ol=el('ol','feat'); w.features.forEach(t=>ol.appendChild(el('li',null,t)));
    f.appendChild(ol); b.appendChild(f);
    const n=el('div','note'); n.innerHTML='<b>시상 전개 방식</b><br>'+w.flowNote; b.appendChild(n);
  },true));

  // 2 시상 전개
  a.appendChild(sec(2,'시상 전개 정리',b=>{
    w.flow.forEach(s=>{
      const d=el('div','step');
      const t=el('div','t'); t.appendChild(el('b',null,s.step));
      t.appendChild(el('em',null,s.line)); d.appendChild(t);
      d.appendChild(el('div','b',s.body));
      d.appendChild(el('div','m','화자의 정서·태도  '+s.mood));
      b.appendChild(d);
    });
  }));

  // 3 원문과 구절 풀이
  a.appendChild(sec(3,'원문과 구절 풀이',b=>{
    w.text.forEach(t=>{
      const d=el('div','blk');
      d.appendChild(el('span','bh',t.head+' · '+t.sub));
      /* 원문은 선생님이 직접 넣는다. orig 가 비어 있으면 풀이만 보여 주고
         풀이가 두 칸을 다 쓰도록 한다. */
      if(t.orig && t.orig.length){
        const p=el('div','poem');
        t.orig.forEach(o=>{ p.appendChild(el('div','ln',o.t));
          if(o.n) p.appendChild(el('div','nn',o.n)); });
        d.appendChild(p);
      }else{
        d.classList.add('noorig');
      }
      const g=el('div','gl');
      t.notes.forEach(([k,v])=>{ const r=el('div','g');
        if(k) r.appendChild(el('b',null,k));      /* 이름표가 없으면 글만 */
        else r.classList.add('plain');
        r.appendChild(el('span',null,v)); g.appendChild(r); });
      d.appendChild(g);
      b.appendChild(d);
    });
    const n=el('div','note');
    n.appendChild(el('b',null,'출제 가능 구절 별도 풀이'));
    const ol=el('ol','num'); w.keyLines.forEach(t=>ol.appendChild(el('li',null,t)));
    n.appendChild(ol); b.appendChild(n);
  }));

  // 4 표현상 특징
  a.appendChild(sec(4,'표현상 특징',b=>{
    w.devices.forEach((d,i)=>{
      const c=el('div','dev');
      const n=el('div','n'); n.appendChild(el('i',null,String(i+1)));
      n.appendChild(el('span',null,d.name)); c.appendChild(n);
      c.appendChild(el('div','e',d.ex));
      c.appendChild(el('div','f',d.eff));
      b.appendChild(c);
    });
    const t=el('div','trap');
    t.appendChild(el('div','th','⚠ 자주 나오는 함정 — 이 작품에 쓰이지 않은 표현'));
    w.traps.forEach(([k,v])=>{ const r=el('div','ti');
      r.appendChild(el('b',null,k)); r.appendChild(el('span',null,v)); t.appendChild(r); });
    b.appendChild(t);
    const c=el('div','cont'); c.appendChild(el('div','ch','구조적 대응'));
    w.contrast.forEach(([k,v])=>{ const r=el('div','ci');
      r.appendChild(el('b',null,k)); r.appendChild(el('span',null,v)); c.appendChild(r); });
    b.appendChild(c);
  }));

  // 5 핵심 시어
  a.appendChild(sec(5,'핵심 시어·소재의 상징적 의미',b=>{
    w.symbols.forEach(([k,v])=>b.appendChild(kv(k,v)));
  }));

  // 6 시험 직전 핵심 정리
  a.appendChild(sec(6,'시험 직전 핵심 정리',b=>{
    const f=el('div','fin');
    w.summary.forEach(([k,v])=>{ const r=el('div','fi');
      r.appendChild(el('b',null,k)); r.appendChild(el('span',null,v)); f.appendChild(r); });
    b.appendChild(f);
  }));

  // 7 OX
  a.appendChild(sec(7,'OX 확인 문제 10문항',b=>oxBuild(b,w)));

  a.appendChild(el('div','foot','글자가 작으면 오른쪽 위 가+ 를 누르세요.'));
  window.scrollTo(0,0);
}

function oxBuild(b,w){
  b.innerHTML='';
  if(w.oxNote){ const n=el('div','note',w.oxNote); n.style.marginTop='8px'; b.appendChild(n); }
  const state=[];
  const sc=el('div','score'); sc.style.display='none';
  w.ox.forEach((o,i)=>{
    const c=el('div','oxq');
    const q=el('div','qq'); q.appendChild(el('i',null,String(i+1)));
    q.appendChild(el('span',null,o.q)); c.appendChild(q);
    const bar=el('div','oxb');
    const sol=el('div','oxs'); sol.style.display='none';
    [['O',true],['X',false]].forEach(([lb,val])=>{
      const bt=el('button',null,lb);
      bt.onclick=()=>{
        if(state[i]!==undefined) return;
        state[i]= (val===o.a);
        [...bar.children].forEach(x=>x.disabled=true);
        bt.classList.add(val===o.a?'ok':'no','sel');
        if(val!==o.a) [...bar.children].find(x=>x.textContent===(o.a?'O':'X')).classList.add('ok');
        sol.innerHTML='<b>'+(val===o.a?'맞았습니다':'틀렸습니다 — 정답 '+(o.a?'O':'X'))+'</b><br>'+o.sol;
        sol.style.display='block';
        const done=state.filter(x=>x!==undefined).length;
        if(done===w.ox.length){
          const ok=state.filter(x=>x).length;
          sc.innerHTML=''; sc.appendChild(el('b',null,ok+' / '+w.ox.length));
          sc.appendChild(el('span',null,'틀린 문항의 해설을 다시 읽어 보세요.'));
          const r=el('button','rst','다시 풀기'); r.onclick=()=>oxBuild(b,w);
          sc.appendChild(r); sc.style.display='block';
          sc.scrollIntoView({behavior:'smooth',block:'nearest'});
        }
      };
      bar.appendChild(bt);
    });
    c.appendChild(bar); c.appendChild(sol); b.appendChild(c);
  });
  b.appendChild(sc);
}

$('#bk').onclick=home;
window.addEventListener('hashchange',()=>{
  const h=location.hash.slice(1);
  if(h && LIT.works.some(w=>w.id===h)) open(h); else home();
});
if(!ijsUser()){
  location.replace('index.html');
}else{
  LIT.works = LIT.works.filter(w=>ijsOpen('lit', w.title));
  const h0=location.hash.slice(1);
  if(h0 && LIT.works.some(w=>w.id===h0)) open(h0); else home();
}
</script>
